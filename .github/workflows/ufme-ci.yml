name: UFME CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Browser and end-to-end quality audit
        run: |
          python3 universal-frontend-master-source/scripts/generate-prototype.py
          python3 -m http.server 5173 --directory prototypes &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:5173 && break
            sleep 1
          done
          npm run test:browser http://localhost:5173
          # Seed the baseline from this build; CI compares the same build on the
          # next run in a project that commits .ufme/evidence/baseline.
          node universal-frontend-master-source/scripts/visual-diff.js \
            --baseline .ufme/evidence/baseline \
            --current .ufme/evidence/screenshots --update-baseline
          UFME_SLOP_PATH=prototypes \
          UFME_CHROME_FLAGS="--headless=new --no-sandbox --disable-dev-shm-usage" \
          python3 universal-frontend-master-source/scripts/quality-check.py \
            --only audit --require audit --target http://localhost:5173 \
            --report .ufme/evidence/quality-report.json

      - name: Build agents (check)
        run: python3 universal-frontend-master-source/scripts/build-agents.py --check

      - name: Test project-memory seeding
        run: |
          python3 - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          script = Path("universal-frontend-master-source/scripts/seed-project-memory.py").resolve()
          with tempfile.TemporaryDirectory(prefix="ufme-seed-test-") as temp:
              target = Path(temp)
              subprocess.run(["python3", str(script), str(target)], check=True)
              memory = target / ".ufme"
              required = ["TASKS.md", "ENVIRONMENT.md", "SKILL_VALIDATION.md"]
              for name in required:
                  path = memory / name
                  assert path.is_file() and path.stat().st_size > 0, f"missing seed: {name}"

              # Prove an existing user file is preserved by a second seed.
              tasks = memory / "TASKS.md"
              tasks.write_text("# user-owned task state\\n", encoding="utf-8")
              subprocess.run(["python3", str(script), str(target)], check=True)
              assert tasks.read_text(encoding="utf-8") == "# user-owned task state\\n"
          PY

      - name: Seed project runtime memory for self-audit
        run: python3 universal-frontend-master-source/scripts/seed-project-memory.py "$GITHUB_WORKSPACE"

      - name: Self-improve
        run: python3 universal-frontend-master-source/scripts/self-improve.py
