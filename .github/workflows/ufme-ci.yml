name: UFME CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build agents (check)
        run: python3 universal-frontend-master-source/scripts/build-agents.py --check

      - name: Self-improve
        run: python3 universal-frontend-master-source/scripts/self-improve.py
